[package]
name = "ai-gens-packages-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust client for the AI Gens public package registry"
repository = "https://github.com/ai-gens/packages"
readme = "README.md"

[dependencies]
reqwest = { version = "0.11.27", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "1"

[dev-dependencies]
serde_json = "1"
