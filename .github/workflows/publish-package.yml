name: Publish package release

on:
  repository_dispatch:
    types:
      - package-release-published
  workflow_dispatch:
    inputs:
      package:
        description: Registered package ID
        required: true
        type: string
      release_id:
        description: Private source GitHub Release ID
        required: true
        type: string
      tag:
        description: Private source GitHub Release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: package-registry-write
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out registry
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check publishing secrets
        shell: bash
        env:
          SOURCE_REPOSITORY_TOKEN: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          PACKAGE_SOURCES_JSON: ${{ vars.PACKAGE_SOURCES_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_REPOSITORY_TOKEN}" ]]; then
            echo "::error::SOURCE_REPOSITORY_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "${PACKAGE_SOURCES_JSON}" ]]; then
            echo "::error::PACKAGE_SOURCES_JSON is not configured."
            exit 1
          fi

      - name: Test registry logic
        run: node --test tests/*.test.mjs

      - name: Publish package
        id: publish
        env:
          SOURCE_REPOSITORY_TOKEN: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
          PACKAGE_SOURCES_JSON: ${{ vars.PACKAGE_SOURCES_JSON }}
          TARGET_REPOSITORY_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs

      - name: Validate generated JSON
        shell: bash
        run: |
          set -euo pipefail
          jq empty index.json
          find packages -type f -name '*.json' -exec jq empty {} +

      - name: Commit registry metadata
        shell: bash
        env:
          PACKAGE_ID: ${{ steps.publish.outputs.package }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json packages

          if git diff --cached --quiet; then
            echo "Registry metadata is already current."
            exit 0
          fi

          git commit -m "chore(registry): publish ${PACKAGE_ID} v${VERSION}"
          git push origin HEAD:main
